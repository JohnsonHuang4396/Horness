# ============================================================
# Harness × Codex 封装配置
# 依赖共享运行时：.harness/scripts/evidence.sh、hook-file-change.sh
# 通用工作规范见项目根 AGENTS.md（Codex 自动读取）。
# 角色定义见 agents/<name>.toml（每个角色一个 TOML）。
# ============================================================

# 多智能体：启用后按 agents/<name>.toml 加载角色。
agents.enabled = true

# 除 AGENTS.md 外，也读取 CLAUDE.md 作为项目文档。
project_doc_fallback_filenames = ["CLAUDE.md"]

# Harness 需要写证据账本与阶段产物，默认授予工作区写权限。
# 内置 profile 为 :workspace（写工作区）与 :read-only；:workspace-write 不是合法 profile。
default_permissions = ":workspace"

# 执行策略：松紧控制见 rules/harness.rules（Starlark）。
# 默认仅放行 harness 脚本与 git/只读；危险路径(删除/sudo/网络)收紧。

# ------------------------------------------------------------
# 证据挂钩：任何工具调用后把文件变化写入证据账本。
# ------------------------------------------------------------
[[hooks.PostToolUse]]
matcher = "**/*"
hooks = [
  { type = "command", command = ".harness/scripts/hook-file-change.sh" },
]

# ------------------------------------------------------------
# 会话开始：建立/切换当前 Host Session，确保证据账本就绪。
# ------------------------------------------------------------
[[hooks.SessionStart]]
matcher = "**/*"
hooks = [
  { type = "command", command = ".harness/scripts/evidence.sh event session.start" },
]

# ------------------------------------------------------------
# 内联角色占位（可选）：也可不用独立文件，把角色直接写在下面。
# 例如：
#   [agents.roles.controller]
#   name = "controller"
#   description = "Harness 编排角色：P0 接收与路由、P5 基线、P10 收尾"
#   instructions = "..."
#   nickname_candidates = ["controller", "编排"]
# 已启用独立文件方案（agents/*.toml），此处留作切换参考。
# ------------------------------------------------------------